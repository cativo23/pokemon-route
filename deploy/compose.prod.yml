name: pokemon-guide

services:
  app:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      # Sin esto nginx no manda Cache-Control y el navegador sirve versiones viejas.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - traefik.http.routers.pokemon.rule=Host(`pokemon.cativo.dev`)
      - "traefik.http.routers.pokemon.entrypoints=websecure"
      - "traefik.http.routers.pokemon.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.pokemon.loadbalancer.server.port=80"
      - "traefik.docker.network=space-server_web"
    networks:
      - space-server_web

networks:
  space-server_web:
    external: true
