# Config de nginx para pokemon.cativo.dev.
#
# `no-cache` no significa "no guardar", sino "guardá pero revalidá siempre". Con el
# ETag que nginx ya manda, esa revalidación es un 304 vacío. Sin esta cabecera el
# navegador aplica caché heurística y te sigue mostrando la versión vieja.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets NO deben caer al index: si falta un .css, .js o un sprite, tiene
    # que dar 404. Con el fallback, un archivo borrado devolvia 200 con HTML
    # adentro y el error se volvia imposible de ver desde fuera.
    location /assets/ {
        try_files $uri =404;
    }
}
