name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site has no dependencies, so neither do its checks: the validator
      # is standard-library Python and the JS check is node's own parser.
      - name: Project rules
        run: python3 tools/validate.py

      - name: JavaScript syntax
        run: node --check assets/app.js

      - name: Page weight budget
        run: |
          BYTES=$(du -sb --exclude=.git --exclude=docs --exclude=deploy --exclude=tools . | cut -f1)
          echo "Deployable weight: $((BYTES / 1024)) KB"
          if [ "$BYTES" -gt 409600 ]; then
            echo "::error::Over the 400 KB budget."
            exit 1
          fi
