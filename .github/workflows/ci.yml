name: checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      # Anclado al SHA del commit, no a una etiqueta: una etiqueta es mutable y
      # quien controle el repo de la accion puede reapuntarla a otro codigo.
      # Dependabot lo mantiene al dia (.github/dependabot.yml), asi que anclar
      # no significa quedarse viejo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The site has no dependencies, so neither do its checks: the validator
      # is standard-library Python and the JS check is node's own parser.
      - name: Project rules
        run: python3 tools/validate.py

      - name: JavaScript syntax
        run: node --check assets/app.js

      - name: Page weight budget
        run: |
          BYTES=$(du -sb --exclude=.git --exclude=docs --exclude=deploy --exclude=tools . | cut -f1)
          echo "Deployable weight: $((BYTES / 1024)) KB"
          if [ "$BYTES" -gt 409600 ]; then
            echo "::error::Over the 400 KB budget."
            exit 1
          fi
